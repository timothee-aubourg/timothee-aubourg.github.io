{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <a class="site-title" href="{{ base_path }}/">{{ site.title }}</a>
        {%- comment -%}
          Deliberately a <div>, not a <button>. The remote theme's greedy-nav
          script grabs $("#site-nav button") as its own overflow toggle: it
          adds .hidden to whatever it finds and binds a second click handler.
          Using a non-button element keeps that selector from matching.
        {%- endcomment -%}
        <div id="mobile-nav-toggle" class="mobile-nav-toggle" role="button"
             tabindex="0" aria-label="Toggle navigation" aria-expanded="false"
             aria-controls="mobile-nav">
          <span></span><span></span><span></span>
        </div>
        <ul class="visible-links desktop-nav">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
        <ul id="mobile-nav" class="mobile-nav hidden">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="{% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>

<script>
  (function () {
    var toggle = document.getElementById('mobile-nav-toggle');
    var nav = document.getElementById('mobile-nav');
    if (!toggle || !nav) return;

    function setOpen(open) {
      nav.classList.toggle('hidden', !open);
      toggle.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    toggle.addEventListener('click', function () {
      setOpen(nav.classList.contains('hidden'));
    });

    /* role="button" elements do not fire click on Enter/Space by default.
       Block comments only here: the compress layout strips newlines in
       production, so a // comment would swallow the rest of the script. */
    toggle.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        setOpen(nav.classList.contains('hidden'));
      }
    });

    /* Close after following a link, so returning via back button is not stuck open. */
    nav.addEventListener('click', function (e) {
      if (e.target.closest('a')) setOpen(false);
    });
  })();
</script>
